          "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
          "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}]
        }
      }
    }
  }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full px-margin py-space-xl">
<!-- Brand & Intro Section -->
<header class="flex flex-col items-center text-center mt-space-md mb-space-xl">
<div class="relative flex items-center justify-center w-16 h-16 rounded-full bg-tertiary-fixed/30 mb-space-md shadow-sm">
<img alt="Tangkay Sprout Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XFsqiiZ55PamYinSLTWSg5seRjqANB1tf2Q7DndpxiMqbWi6oRiu0Npvp8MCBVjUiCcm8SeeGs7OBYvCzQxFckKQUiW2FAmyVGmSW4ywsVfb6JHIB1KNfPM_HVoqdtPGwHMtpOC6mBGwR5Hsvl3o5SPWQb53rnyUr7_A52S95gnqljupXr3oLaL04oinZKO_3Mur5OPPmicTjO_uIFG4_5vbbX-IjjadzqVK8OWj_tX00qMtGgprlBHVKL">
<div class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
</div>
</div>
<div class="flex items-center gap-1.5 mb-space-xs">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">Tangkay Scan</h1>
<span class="bg-primary-fixed/50 text-on-primary-fixed text-label-sm font-label-sm px-2 py-0.5 rounded-full">v1.2</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
      Attendance that takes a minute.
    </p>
</header>
<!-- Interactive Auth Card (Stationery Leaflet aesthetic) -->
<section class="bg-surface-container-lowest rounded-xl shadow-md p-space-lg flex flex-col mb-space-lg">
<!-- Segmented Tab for Sign Up / Log In switch -->
<div class="flex p-1 bg-surface-container rounded-xl mb-space-lg" role="tablist">
<button class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5" id="tab-signup" onclick="switchMode('signup')" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
        Create room
      </button>
<button class="flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="tab-login" onclick="switchMode('login')" type="button">
        Log in
      </button>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Full Name (Only visible on Sign Up) -->
<div class="flex flex-col gap-1 transition-all" id="name-field-group">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="teacher-name">
          Teacher Name
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface placeholder-outline font-body-md text-body-md px-3.5 py-3 rounded-xl focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 transition-all" id="teacher-name" placeholder="Guro Maria Santos" type="text">
<span class="material-symbols-outlined absolute right-3 text-outline text-body-lg pointer-events-none">
            badge
          </span>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="teacher-email">
          School Email
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface placeholder-outline font-body-md text-body-md px-3.5 py-3 rounded-xl focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 transition-all" id="teacher-email" placeholder="teacher@school.edu.ph" required="" type="email">
<span class="material-symbols-outlined absolute right-3 text-outline text-body-lg pointer-events-none">
            mail
          </span>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="teacher-password">
            Password
          </label>
<a class="hidden font-label-sm text-label-sm text-primary hover:underline" href="#" id="forgot-link">
            Forgot?
          </a>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-low text-on-surface placeholder-outline font-body-md text-body-md px-3.5 py-3 rounded-xl focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 transition-all pr-11" id="teacher-password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2.5 p-1 text-outline hover:text-on-surface focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-body-lg" id="eye-icon">
              visibility
            </span>
</button>
</div>
</div>
<!-- School Organization Pill (Sign Up Context) -->

<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary py-3.5 px-6 rounded-full font-label-lg text-label-lg shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-space-xs" id="submit-button" type="submit">
<span id="button-label" class="">Create account</span>
<span class="material-symbols-outlined text-body-md">arrow_forward</span>
</button>
</form>
<!-- Secondary Toggle Link -->
<div class="flex items-center justify-center mt-space-lg text-center">
<button class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors focus:outline-none py-1" id="toggle-auth-btn" onclick="toggleMode()" type="button">
        Already have a room? <span class="font-label-md text-label-md text-primary underline underline-offset-4 ml-1">Log in</span>
</button>
</div>
</section>
<!-- Tactile Reassurance Stamp & Micro-features -->
<div class="flex flex-col items-center gap-space-md px-2">
<!-- Privacy Shield Footnote Badge -->

<!-- Quick Quick-Pass Guide / Visual Delight Card -->

</div>
</div>
<script>
  let currentMode = 'signup';

  function switchMode(mode) {
    currentMode = mode;
    const isSignup = mode === 'signup';
    
    // Tab styles
    const tabSignup = document.getElementById('tab-signup');
    const tabLogin = document.getElementById('tab-login');
    
    if (isSignup) {
      tabSignup.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabSignup.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>Create room';
      
      tabLogin.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      tabLogin.innerHTML = 'Log in';
      
      // Field toggles
      document.getElementById('name-field-group').classList.remove('hidden');
      document.getElementById('school-pill').classList.remove('hidden');
      document.getElementById('forgot-link').classList.add('hidden');
      
      // CTA
      document.getElementById('button-label').innerText = 'Create account';
      document.getElementById('toggle-auth-btn').innerHTML = 'Already have a room? <span class="font-label-md text-label-md text-primary underline underline-offset-4 ml-1">Log in</span>';
    } else {
      tabLogin.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5";
      tabLogin.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>Log in';
      
      tabSignup.className = "flex-1 py-2 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      tabSignup.innerHTML = 'Create room';
      
      // Field toggles
      document.getElementById('name-field-group').classList.add('hidden');
      document.getElementById('school-pill').classList.add('hidden');
      document.getElementById('forgot-link').classList.remove('hidden');
      
      // CTA
      document.getElementById('button-label').innerText = 'Open my room';
      document.getElementById('toggle-auth-btn').innerHTML = 'New here? <span class="font-label-md text-label-md text-primary underline underline-offset-4 ml-1">Create account</span>';
    }
  }

  function toggleMode() {
    switchMode(currentMode === 'signup' ? 'login' : 'signup');
  }

  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('teacher-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.innerText = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.innerText = 'visibility';
    }
  }

  function triggerAuth() {
    const btn = document.getElementById('submit-button');
    const originalText = document.getElementById('button-label').innerText;
    
    document.getElementById('button-label').innerText = currentMode === 'signup' ? 'Setting up classroom...' : 'Checking roster...';
    btn.disabled = true;
    btn.classList.add('opacity-75');

    setTimeout(() => {
      document.getElementById('button-label').innerText = 'Welcome aboard!';
      btn.classList.remove('opacity-75');
      btn.disabled = false;
    }, 900);
  }
</script></main>

</body></html>
